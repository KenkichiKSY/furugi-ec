{% extends 'base.html' %}

{% block title %}お気に入り{% endblock %}

{% block content %}
<h1 class="mb-4">お気に入り</h1>
<div class="row">
    {% for favorite in favorites %}
    <div class="col-md-3 mb-4">
        <div class="card h-100">
            {% if favorite.product.image %}
            <img src="{{ favorite.product.image.url }}" class="card-img-top" alt="{{ favorite.product.name }}">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ favorite.product.name }}</h5>
                <p class="card-text">{{ favorite.product.price }}円</p>
                <a href="{% url 'products:detail' favorite.product.slug %}" class="btn btn-primary">詳細を見る</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p>お気に入りに登録された商品はありません。</p>
    {% endfor %}
</div>
{% endblock %}
