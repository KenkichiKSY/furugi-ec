{% extends 'base.html' %}

{% block title %}お気に入り{% endblock %}

{% block content %}
<h1>お気に入り</h1>
<div class="product-grid">
    {% for favorite in favorites %}
    <article class="product-card">
        <div class="product-thumb {% if not favorite.product.image %}{% cycle 'tex-flannel' 'tex-denim' 'tex-cord' 'tex-knit' 'tex-leather' 'tex-twill' 'tex-flannel-navy' 'tex-denim-dark' %}{% endif %}">
            {% if favorite.product.image %}
            <img src="{{ favorite.product.image.url }}" alt="{{ favorite.product.name }}">
            {% endif %}
        </div>
        <div class="product-name"><a href="{% url 'products:detail' favorite.product.slug %}">{{ favorite.product.name }}</a></div>
        <div class="product-foot">
            <span class="price num">¥{{ favorite.product.price }}</span>
            <a class="view-link" href="{% url 'products:detail' favorite.product.slug %}">詳細</a>
        </div>
    </article>
    {% empty %}
    <p class="empty-note">お気に入りに登録された商品はありません。</p>
    {% endfor %}
</div>
{% endblock %}
