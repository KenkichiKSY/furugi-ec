{% extends 'base.html' %}

{% block title %}レビューを書く{% endblock %}

{% block content %}
<div class="form-card">
    <h1>{{ product.name }}のレビュー</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn-solid">投稿する</button>
            <a href="{% url 'products:detail' product.slug %}" class="btn-outline">戻る</a>
        </div>
    </form>
</div>
{% endblock %}
