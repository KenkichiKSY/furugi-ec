{% extends 'base.html' %}
{% block title %}パスワード再設定{% endblock %}
{% block content %}
<h1>パスワードをお忘れの方</h1>
<p>登録済みのメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">送信する</button>
</form>
{% endblock %}
