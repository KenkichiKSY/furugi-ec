{% extends 'base.html' %}
{% block title %}パスワード再設定{% endblock %}
{% block content %}
<div class="form-card">
    <h1>パスワードをお忘れの方</h1>
    <p class="intro-text">登録済みのメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn-solid">送信する</button>
        </div>
    </form>
</div>
{% endblock %}
