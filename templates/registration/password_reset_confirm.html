{% extends 'base.html' %}
{% block title %}新しいパスワードの設定{% endblock %}
{% block content %}
<h1>新しいパスワードを設定してください</h1>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">変更する</button>
</form>
{% else %}
<p>このパスワード再設定用リンクは無効です。リンクの有効期限が切れているか、既に使用されています。</p>
<p><a href="{% url 'password_reset' %}">もう一度パスワード再設定をリクエストする</a></p>
{% endif %}
{% endblock %}
