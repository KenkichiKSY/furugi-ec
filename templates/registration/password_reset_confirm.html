{% extends 'base.html' %}
{% block title %}新しいパスワードの設定{% endblock %}
{% block content %}
<div class="form-card">
    <h1>新しいパスワードを設定してください</h1>
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn-solid">変更する</button>
        </div>
    </form>
    {% else %}
    <p class="intro-text">このパスワード再設定用リンクは無効です。リンクの有効期限が切れているか、既に使用されています。</p>
    <p class="form-foot"><a href="{% url 'password_reset' %}">もう一度パスワード再設定をリクエストする</a></p>
    {% endif %}
</div>
{% endblock %}
