{% extends 'base.html' %}
{% block title %}配送先住所の削除{% endblock %}
{% block content %}
<div class="form-card">
    <h1>この配送先住所を削除しますか?</h1>
    <p class="intro-text">
        {{ object.recipient_name }}<br>
        〒{{ object.postal_code }} {{ object.prefecture }}{{ object.city }}{{ object.building }}<br>
        {{ object.phone_number }}
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn-solid">削除する</button>
            <a href="{% url 'accounts:address_list' %}" class="btn-outline">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
